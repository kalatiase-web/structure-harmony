name: Build jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      # When javac cannot resolve a class, print where that class actually lives in the
      # Minecraft jar, so a wrong import is fixed in one round trip instead of by guessing.
      - name: Locate unresolved classes
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          names=$(grep -oP 'symbol:\s+class \K\w+' build.log 2>/dev/null | sort -u)
          [ -z "$names" ] && echo "no unresolved classes" && exit 0
          jars=$(find ~/.gradle/caches -name '*.jar' 2>/dev/null | grep -iE 'forge|minecraft|client|joined' | head -60)
          for c in $names; do
            echo "### $c"
            for j in $jars; do unzip -l "$j" 2>/dev/null | grep -E "/${c}\.class$" | awk '{print $NF}'; done \
              | sed 's#/#.#g; s#\.class$##' | sort -u | head -5
          done

      - name: Tail of build log
        if: always()
        run: tail -n 120 build.log || true

      # Pushed back into the repo so the full compiler output can be read without
      # needing API access to the Actions logs.
      - name: Commit build log
        if: always()
        run: |
          mkdir -p ci
          tail -n 400 build.log > ci/last-build.log || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci/last-build.log
          git commit -m "ci: build log for run ${{ github.run_number }} [skip ci]" || exit 0
          git push || true

      # Boots a real Forge server and generates spawn chunks. This is what catches a mixin
      # that compiles but never applies - the failure mode where the mod loads and silently
      # does nothing. require = 1 turns that into a hard startup error, and this step reads it.
      - name: Smoke test - boot server and generate a world
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          {
            echo "online-mode=false"
            echo "level-seed=314159"
            echo "max-tick-time=-1"
            echo "sync-chunk-writes=false"
          } > run/server.properties

          timeout 600 ./gradlew runServer --no-daemon --console=plain 2>&1 | tee server.log || true

          echo "::group::server log tail"
          tail -n 60 server.log
          echo "::endgroup::"

          if grep -qiE "Mixin apply failed|InvalidInjectionException|Critical injection failure|Mixin transformation of .* failed|was not found in" server.log; then
            echo "::error::Mixin failed to apply - see the log above"
            grep -niE "Mixin apply failed|InvalidInjectionException|Critical injection failure|Mixin transformation of .* failed|was not found in" server.log | head -20
            exit 1
          fi

          if ! grep -q 'Done (' server.log; then
            echo "::error::Server never finished starting, so world generation was not exercised"
            exit 1
          fi

          echo "Server booted and generated spawn chunks with both mixins applied."

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: structureharmony-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Structure Harmony 1.0.0 (build ${{ github.run_number }})
          body: |
            Forge 1.20.1 build of Structure Harmony.
            Drop the jar in your `mods` folder. Config is generated at
            `config/structureharmony-common.toml` on first launch.
          files: build/libs/*.jar

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
