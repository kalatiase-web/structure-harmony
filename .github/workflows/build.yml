name: Build jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Tail of build log
        if: always()
        run: tail -n 120 build.log || true

      # Pushed back into the repo so the full compiler output can be read without
      # needing API access to the Actions logs.
      - name: Commit build log
        if: always()
        run: |
          mkdir -p ci
          tail -n 400 build.log > ci/last-build.log || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci/last-build.log
          git commit -m "ci: build log for run ${{ github.run_number }} [skip ci]" || exit 0
          git push || true

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: structureharmony-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Structure Harmony 1.0.0 (build ${{ github.run_number }})
          body: |
            Forge 1.20.1 build of Structure Harmony.
            Drop the jar in your `mods` folder. Config is generated at
            `config/structureharmony-common.toml` on first launch.
          files: build/libs/*.jar

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
